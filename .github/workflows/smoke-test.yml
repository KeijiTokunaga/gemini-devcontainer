name: DevContainer Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Build and up devcontainer
        run: |
          devcontainer up \
            --workspace-folder $(pwd)

      - name: Verify tools inside devcontainer
        run: |
          devcontainer exec \
            --workspace-folder $(pwd) \
            -- bash -c "
              set -e
              echo '=============================='
              echo 'DevContainer Tool Check'
              echo '=============================='
              echo -n '[node]   ' && node --version
              echo -n '[npm]    ' && npm --version
              echo -n '[git]    ' && git --version
              echo -n '[gemini] ' && (gemini --version || echo 'not found')
              echo '=============================='
            "
