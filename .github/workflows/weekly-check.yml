name: Weekly Health Check

on:
  schedule:
    - cron: '0 1 * * 1'  # 毎週月曜 JST 10:00 (UTC 01:00)
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build fresh (no cache)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          no-cache: true
          tags: gemini-devcontainer:weekly

      - name: Run smoke test
        if: success()
        run: |
          docker run --rm gemini-devcontainer:weekly bash -c "
            node --version && npm --version && git --version
            echo 'Weekly health check: PASSED'
          "

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Weekly Health Check Failed (${new Date().toISOString().slice(0, 10)})`,
              body: [
                '## 自動検知: Weekly Health Check が失敗しました',
                '',
                'ベースイメージの更新や依存関係の変更により、ビルドまたはテストが失敗した可能性があります。',
                '',
                `**実行ログ:** [こちらを確認](${runUrl})`,
                '',
                '### 推奨される対応',
                '1. 実行ログからエラー箇所を特定してください。',
                '2. `.devcontainer/Dockerfile` やワークフロー定義を修正し、修正PRを作成してください。',
              ].join('\n'),
              labels: ['ci-failure', 'bug']
            });
